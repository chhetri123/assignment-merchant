services:
  postgres:
    image: postgres:16-alpine
    container_name: merchant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-merchant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-merchant}
      POSTGRES_DB: ${DB_DATABASE:-merchant}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-merchant} -d ${DB_DATABASE:-merchant}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: merchant_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merchant_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # In-network services use container ports, not the host mapping above.
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migration:run && npm run seed && node dist/main"

volumes:
  postgres_data:
  redis_data:
